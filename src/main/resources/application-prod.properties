# ── Prod profile ──────────────────────────────────────────────────────────────
# Active when: SPRING_PROFILES_ACTIVE=prod
#
# ALL environment variables listed in .env.example are REQUIRED in production.
# There are no fallback defaults here — the application will refuse to start
# if any required variable is missing.
#
# Schema management:
#   Use a proper migration tool (Flyway / Liquibase) to evolve the database
#   schema.  Hibernate is set to validate so it will refuse to start if the
#   schema does not match the entity model — this acts as a deployment gate.
#
# Connection URL must NOT include createDatabaseIfNotExist or useSSL=false.
# Example production URL (TLS enforced):
#   DB_URL=jdbc:mysql://db.internal:3306/task_management_db?useSSL=true&requireSSL=true&serverTimezone=UTC

# ── DataSource (prod) ─────────────────────────────────────────────────────────
# No defaults — all must be injected via environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production-sized pool.  Adjust maximum-pool-size to match the DB instance's
# max_connections setting (MySQL default is 151; keep well below that limit
# across all application replicas combined).
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# validate: Hibernate checks the schema matches the entity model but NEVER
# alters it.  If they diverge the application exits immediately on startup.
spring.jpa.hibernate.ddl-auto=validate

# Never log SQL in production — it leaks query structure and bind values.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Actuator (prod) ───────────────────────────────────────────────────────────
# Only health is publicly accessible (SecurityConfig permits /actuator/health).
# All other endpoints are disabled — they must not be reachable from outside
# the internal network even if accidentally authenticated.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Disable the /actuator discovery endpoint to avoid leaking what is available.
management.endpoints.web.discovery.enabled=false

# ── Logging (prod) ────────────────────────────────────────────────────────────
# Root level: WARN — only warnings and errors reach the log aggregator.
# Application code: INFO — service starts, significant operations, errors.
# Security events: WARN — log auth failures but not routine filter activity.
logging.level.root=WARN
logging.level.com.viwe.task_management_system=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.zaxxer.hikari=WARN

# logback-spring.xml activates the JSON appender for the "prod" springProfile.
# Logs are written to stdout for capture by the container orchestrator (Docker,
# Kubernetes) or a log shipper (Fluentd, Logstash).
