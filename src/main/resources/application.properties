spring.application.name=task-management-system

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource ────────────────────────────────────────────────────────────────
# All three credentials are REQUIRED via environment variables.
# There are NO defaults for username/password so the application fails fast
# if the environment is not set up correctly rather than connecting as root
# with an empty password.
#
# Required env vars:
#   DB_URL      — full JDBC URL (see .env.example)
#   DB_USERNAME — database user
#   DB_PASSWORD — database password
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP connection pool (shared baseline) ────────────────────────────────
# Profiles may tighten or relax these values.
# connection-timeout: max ms to wait for a connection from the pool (30 s)
spring.datasource.hikari.connection-timeout=30000
# idle-timeout: max ms a connection may sit idle before being evicted (10 min)
spring.datasource.hikari.idle-timeout=600000
# max-lifetime: max ms a connection lives in the pool before forced replacement
# (must be shorter than the database's wait_timeout — MySQL default is 8 h)
spring.datasource.hikari.max-lifetime=1800000
# connection-test-query: lightweight query used to validate connections
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# ddl-auto is intentionally NOT set here — each profile sets its own value:
#   dev  → update   (convenient for local development)
#   prod → validate (schema managed by migrations; Hibernate must not alter it)
#   test → create-drop (Testcontainers: fresh schema per test run)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Hibernate's open-session-in-view anti-pattern.
# This forces proper transaction boundaries in the service layer.
spring.jpa.open-in-view=false

# ── Actuator ──────────────────────────────────────────────────────────────────
# Only /actuator/health is exposed on the main port.
# Sensitive endpoints are disabled here; production profile locks down further.
# SecurityConfig already grants public access to GET /actuator/health.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
# Expose the /actuator base path (returns available links) only when authorised.
management.endpoints.web.discovery.enabled=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# APP_JWT_SECRET is REQUIRED — there is no default. The application will refuse
# to start if this variable is absent (enforced in JwtService constructor).
# Value must be a Base64-encoded HMAC-SHA256 key of at least 32 decoded bytes.
# Generate one with: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET}
# Token lifetime in milliseconds. Default: 24 hours.
# Override with APP_JWT_EXPIRATION_MS (e.g. 3600000 for 1 hour in production).
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
