spring.application.name=task-management-system

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource ────────────────────────────────────────────────────────────────
# Credentials and URL are supplied via environment variables.
# For local development without Docker, set these in your IDE run configuration
# or export them in the shell before running ./gradlew bootRun.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Actuator ──────────────────────────────────────────────────────────────────
# Expose only the health endpoint publicly (security permits /actuator/health).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ── JWT ───────────────────────────────────────────────────────────────────────
# Secret: Base64-encoded HMAC-SHA256 key (min 256 bits / 32 bytes decoded).
# MUST be overridden in staging/production via the APP_JWT_SECRET environment variable.
# The placeholder below is a development-only value — never use it in production.
app.jwt.secret=${APP_JWT_SECRET:dGFzay1tYW5hZ2VtZW50LXN5c3RlbS1kZXYtc2VjcmV0LWtleS0yMDI2LW11c3QtYmUtb3ZlcnJpZGRlbg==}
# Token expiration: 24 hours in milliseconds. Override via APP_JWT_EXPIRATION_MS.
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
