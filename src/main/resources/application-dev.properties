# ── Dev profile ───────────────────────────────────────────────────────────────
# Active when: SPRING_PROFILES_ACTIVE=dev  (or --spring.profiles.active=dev)
#
# This profile is designed for a developer's local machine running MySQL via
# Docker (see docker-compose.yml at the project root).  It is never loaded in
# CI or production.
#
# To start the application locally:
#   1. Copy .env.example → .env and fill in your values.
#   2. docker-compose up -d          (starts MySQL)
#   3. export $(cat .env | xargs)    (loads env vars into the shell)
#   4. ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Or set SPRING_PROFILES_ACTIVE=dev in your IDE run configuration and add the
# DB_* and APP_JWT_SECRET variables to the run environment.

# ── DataSource (dev overrides) ────────────────────────────────────────────────
# Friendly URL for local MySQL — creates the DB if it doesn't exist, skips SSL.
# These defaults match the docker-compose.yml service so `docker-compose up -d`
# works without any extra configuration.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpassword}

# Smaller pool for a single developer's machine.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update: Hibernate auto-creates and adjusts the schema on startup.
# Convenient for dev — no manual migration step needed.
spring.jpa.hibernate.ddl-auto=update

# Log all SQL to the console in dev so queries are visible during development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log bind parameter values alongside SQL so queries are fully readable.
# NEVER enable this in production (leaks sensitive data).
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── Actuator (dev) ────────────────────────────────────────────────────────────
# Expose more endpoints locally so developers can inspect beans, env, mappings.
# These are protected by Spring Security — still require authentication.
management.endpoints.web.exposure.include=health,info,env,beans,mappings,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ── Application info ──────────────────────────────────────────────────────────
info.app.name=Task Management System
info.app.description=Local development instance
info.app.profile=dev

# ── Logging (dev) ─────────────────────────────────────────────────────────────
# Root level: INFO by default.  Application code at DEBUG for visibility.
logging.level.root=INFO
logging.level.com.viwe.task_management_system=DEBUG

# Silence noisy third-party libraries while keeping our own code verbose.
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=INFO

# Human-readable console output in dev (no JSON).
# logback-spring.xml switches to JSON in prod via the "prod" springProfile.
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
