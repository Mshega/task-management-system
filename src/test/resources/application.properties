# ── Test classpath base configuration ────────────────────────────────────────
# This file is loaded for ALL test slices (@WebMvcTest, @DataJpaTest,
# @SpringBootTest) via the test classpath.  Its job is to satisfy required
# property placeholders that have no default in the main application.properties
# so tests can run without any environment variables set in CI or locally.

# ── JWT (test-only secret) ────────────────────────────────────────────────────
# Base64 encoding of the 32-byte ASCII string "01234567890123456789012345678901".
# This is intentionally committed — it is a disposable test fixture, not a
# production secret.  It is NEVER on the main application classpath.
app.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
app.jwt.expiration-ms=86400000

# ── DataSource ────────────────────────────────────────────────────────────────
# The base application.properties requires DB_URL / DB_USERNAME / DB_PASSWORD
# with no defaults, which would break context loading in non-DB test slices
# (@WebMvcTest) that still evaluate property placeholders.
#
# For @DataJpaTest slices that import TestcontainersConfiguration:
#   @ServiceConnection replaces all three values with the real MySQL container
#   coordinates at runtime, so these stubs are never used to open a connection.
#
# For @WebMvcTest slices:
#   No datasource is ever created, so these values are only resolved as strings
#   and never used to establish a JDBC connection.
#
# The driver class is deliberately left as MySQL to avoid loading any extra
# driver jar — Spring Boot's DataSourceAutoConfiguration is excluded by
# @WebMvcTest anyway, and @DataJpaTest's @ServiceConnection takes over.
spring.datasource.url=jdbc:mysql://localhost:3306/test_placeholder
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate (test) ────────────────────────────────────────────────────
# create-drop: Hibernate builds and drops the schema around each test ApplicationContext.
# Testcontainers MySQL is always a fresh container, so this is safe.
spring.jpa.hibernate.ddl-auto=create-drop

# Log SQL during tests so query-level failures are diagnosable.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Actuator (test) ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ── Logging (test) ────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.viwe.task_management_system=INFO
logging.level.org.springframework.security=WARN
